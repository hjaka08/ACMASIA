<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1800" height="520" viewBox="0 0 1800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 800; fill: #111; }
      .h     { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; fill: #111; }
      .t     { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111; opacity: 0.95; }
      .s     { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #111; opacity: 0.85; }
      .box   { stroke: #1f2937; stroke-width: 2; }
      .arrow { stroke: #111; stroke-width: 3; fill: none; }
      .dash  { stroke-dasharray: 8 6; }
    </style>

    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"></path>
    </marker>
  </defs>

  <!-- Title -->
  <text x="900" y="52" text-anchor="middle" class="title">End-to-End Pipeline: GPON GEM-PLI Video Inference</text>

  <!-- Lane labels -->
  <text x="70" y="105" class="h">Reference / Database (known videos)</text>
  <text x="70" y="305" class="h">Query (victim observation)</text>

  <!-- =========================
       LANE 1: Reference / DB
       ========================= -->
  <!-- Box: Video Playback -->
  <rect x="70" y="125" rx="14" ry="14" width="220" height="90" class="box" fill="#e5e7eb"></rect>
  <text x="180" y="160" text-anchor="middle" class="t">Video Playback</text>
  <text x="180" y="182" text-anchor="middle" class="s">(YouTube, fixed res.)</text>

  <!-- Arrow -->
  <line x1="290" y1="170" x2="330" y2="170" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: PCAP Capture -->
  <rect x="340" y="125" rx="14" ry="14" width="240" height="90" class="box" fill="#e5e7eb"></rect>
  <text x="460" y="158" text-anchor="middle" class="t">PCAP Capture</text>
  <text x="460" y="180" text-anchor="middle" class="s">tcpdump/dumpcap, 180s</text>
  <text x="460" y="200" text-anchor="middle" class="s">run#.pcap</text>

  <!-- Arrow -->
  <line x1="580" y1="170" x2="620" y2="170" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: Trace-driven GPON-like Simulator -->
  <rect x="630" y="115" rx="14" ry="14" width="360" height="110" class="box" fill="#dbeafe"></rect>
  <text x="810" y="150" text-anchor="middle" class="t">Trace-driven GPON-like Downstream Simulator</text>
  <text x="810" y="172" text-anchor="middle" class="s">preserve timestamps; fragment Ethernet → GEM</text>
  <text x="810" y="192" text-anchor="middle" class="s">synthesize headers (Port-ID/PTI/12-bit PLI)</text>
  <text x="810" y="212" text-anchor="middle" class="s">pack into fixed 125µs downstream bins</text>

  <!-- Arrow -->
  <line x1="990" y1="170" x2="1030" y2="170" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: Output -->
  <rect x="1040" y="125" rx="14" ry="14" width="230" height="90" class="box" fill="#dbeafe"></rect>
  <text x="1155" y="158" text-anchor="middle" class="t">Output Trace</text>
  <text x="1155" y="180" text-anchor="middle" class="s">gems.csv: (t, PLI)</text>
  <text x="1155" y="200" text-anchor="middle" class="s">(optional frames.csv)</text>

  <!-- Arrow -->
  <line x1="1270" y1="170" x2="1310" y2="170" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: Preprocess + Feature Extraction -->
  <rect x="1320" y="115" rx="14" ry="14" width="310" height="110" class="box" fill="#fde68a"></rect>
  <text x="1475" y="148" text-anchor="middle" class="t">Preprocess &amp; Feature Extraction</text>
  <text x="1475" y="170" text-anchor="middle" class="s">binning (100ms) → cumulative sum</text>
  <text x="1475" y="190" text-anchor="middle" class="s">final-value normalization</text>
  <text x="1475" y="210" text-anchor="middle" class="s">features: cumulative PLI curve (shape/slope)</text>

  <!-- Arrow to DB -->
  <line x1="1630" y1="170" x2="1670" y2="170" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: Reference DB -->
  <rect x="1680" y="125" rx="14" ry="14" width="100" height="90" class="box" fill="#c7d2fe"></rect>
  <text x="1730" y="155" text-anchor="middle" class="t">DB</text>
  <text x="1730" y="178" text-anchor="middle" class="s">N videos</text>
  <text x="1730" y="198" text-anchor="middle" class="s">× runs</text>

  <!-- =========================
       LANE 2: Query (victim)
       ========================= -->
  <!-- Box: Passive Observation -->
  <rect x="70" y="325" rx="14" ry="14" width="250" height="90" class="box" fill="#e5e7eb"></rect>
  <text x="195" y="358" text-anchor="middle" class="t">Passive Observation</text>
  <text x="195" y="380" text-anchor="middle" class="s">same-splitter broadcast</text>
  <text x="195" y="400" text-anchor="middle" class="s">(receive-only capture)</text>

  <!-- Arrow -->
  <line x1="320" y1="370" x2="360" y2="370" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: GEM PLI Trace -->
  <rect x="370" y="325" rx="14" ry="14" width="250" height="90" class="box" fill="#dbeafe"></rect>
  <text x="495" y="358" text-anchor="middle" class="t">GEM PLI Trace</text>
  <text x="495" y="380" text-anchor="middle" class="s">(t, PLI) from headers</text>
  <text x="495" y="400" text-anchor="middle" class="s">Port-ID demux (if known)</text>

  <!-- Arrow -->
  <line x1="620" y1="370" x2="660" y2="370" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Box: Same Preprocess -->
  <rect x="670" y="315" rx="14" ry="14" width="330" height="110" class="box" fill="#fde68a"></rect>
  <text x="835" y="348" text-anchor="middle" class="t">Same Preprocess &amp; Features</text>
  <text x="835" y="370" text-anchor="middle" class="s">binning (100ms) → cumulative sum</text>
  <text x="835" y="390" text-anchor="middle" class="s">normalization → cumulative PLI curve</text>
  <text x="835" y="410" text-anchor="middle" class="s">(option: DTW for time-shift tolerance)</text>

  <!-- Arrow to Similarity -->
  <line x1="1000" y1="370" x2="1040" y2="370" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- =========================
       MERGE: Similarity + Decision
       ========================= -->
  <!-- Similarity box -->
  <rect x="1050" y="315" rx="14" ry="14" width="300" height="110" class="box" fill="#fecaca"></rect>
  <text x="1200" y="348" text-anchor="middle" class="t">Quantitative Similarity</text>
  <text x="1200" y="370" text-anchor="middle" class="s">Pearson correlation / RMSE</text>
  <text x="1200" y="390" text-anchor="middle" class="s">(optional: DTW)</text>
  <text x="1200" y="410" text-anchor="middle" class="s">compare Query vs DB templates</text>

  <!-- Dashed connection from DB (lane 1) down to Similarity -->
  <path d="M1730 215 L1730 270 L1200 270 L1200 315" class="arrow dash" marker-end="url(#arrowhead)"></path>

  <!-- Arrow to decision -->
  <line x1="1350" y1="370" x2="1390" y2="370" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Decision / Rank Voting -->
  <rect x="1400" y="325" rx="14" ry="14" width="230" height="90" class="box" fill="#c7d2fe"></rect>
  <text x="1515" y="360" text-anchor="middle" class="t">Rank Voting</text>
  <text x="1515" y="382" text-anchor="middle" class="s">across metrics / runs</text>
  <text x="1515" y="402" text-anchor="middle" class="s">top-k candidates</text>

  <!-- Arrow to output -->
  <line x1="1630" y1="370" x2="1670" y2="370" class="arrow" marker-end="url(#arrowhead)"></line>

  <!-- Output -->
  <rect x="1680" y="325" rx="14" ry="14" width="100" height="90" class="box" fill="#93c5fd"></rect>
  <text x="1730" y="365" text-anchor="middle" class="t">Output</text>
  <text x="1730" y="390" text-anchor="middle" class="s">Predicted</text>
  <text x="1730" y="410" text-anchor="middle" class="s">Video</text>

  <!-- Small footer note -->
  <text x="900" y="495" text-anchor="middle" class="s">
    Note: trace-driven simulation keeps burstiness/idle periods of adaptive streaming (vs naive constant-rate replay).
  </text>
</svg>
